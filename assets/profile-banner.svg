  <circle cx="720" cy="126" r="4" fill="#ECFEFF"/>
  <circle cx="670" cy="126" r="3" class="pulse p3"/><circle cx="793" cy="126" r="3" class="pulse"/>
</g>
<path d="M713 119L707 113M727 119L733 113M713 133L707 139M727 133L733 139" stroke="#5EEAD4" stroke-width="1.5"/>
<rect y="248" width="900" height="4" fill="url(#accent)"/>
</g>
<rect x=".5" y=".5" width="899" height="251" rx="18" fill="none" stroke="#304B60"/>
</svg>

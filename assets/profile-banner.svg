<svg xmlns="http://www.w3.org/2000/svg" width="900" height="252" viewBox="0 0 900 252" role="img" aria-labelledby="title desc">
<title id="title">Marouane Mounir — AI, Data and Cloud Engineering</title>
<desc id="desc">Dark navy engineering portfolio banner with animated data signals moving through a network of data, intelligence and cloud nodes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#11263A"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-opacity=".08"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="898" height="250" rx="18"/></clipPath>
</defs>
<style>
  .route{stroke-dasharray:5 7;animation:flow 12s linear infinite}
  .pulse{animation:pulse 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .p2{animation-delay:1.2s}.p3{animation-delay:2.4s}
  @keyframes flow{to{stroke-dashoffset:-120}}
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}}
  @media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="252" fill="url(#bg)"/>
<rect x="560" width="340" height="252" fill="url(#grid)"/>
<path d="M535 0L475 252" stroke="#334155" stroke-opacity=".55"/>
<rect x="32" y="33" width="38" height="3" rx="1.5" fill="url(#accent)"/>
<text x="32" y="57" font-family="monospace" font-size="12" letter-spacing="2.1" fill="#67E8F9">ENGINEERING PORTFOLIO / 2027</text>
<text x="30" y="111" font-family="Verdana,Arial,sans-serif" font-size="41" font-weight="700" fill="#F8FAFC">Marouane Mounir</text>
<text x="32" y="142" font-family="Arial,sans-serif" font-size="19" fill="#B9D4E5">AI Engineering  /  Data Engineering  /  Cloud</text>
<text x="32" y="173" font-family="Arial,sans-serif" font-size="14" fill="#94A3B8">Final-year engineering student · ENSET Mohammedia</text>
<rect x="32" y="197" width="272" height="28" rx="14" fill="#0C302F" stroke="#25635F"/>
<circle cx="48" cy="211" r="4" fill="#5EEAD4" class="pulse"/>
<text x="60" y="215" font-family="monospace" font-size="12" fill="#B6F5E9">OPEN TO PFE · FEBRUARY 2027</text>
<g fill="none" stroke="#315B70" stroke-width="1.5">
  <path d="M590 78H654Q670 78 670 94V126H720"/>
  <path d="M590 174H654Q670 174 670 158V126H720"/>
  <path d="M720 126H775Q793 126 793 108V77H841"/>
  <path d="M720 126H775Q793 126 793 144V174H841"/>
</g>
<g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".85" class="route">
  <path d="M590 78H654Q670 78 670 94V126H720"/>
  <path d="M590 174H654Q670 174 670 158V126H720"/>
  <path d="M720 126H775Q793 126 793 108V77H841"/>
  <path d="M720 126H775Q793 126 793 144V174H841"/>
</g>
<g font-family="monospace" font-size="10" fill="#A6C9D9" text-anchor="middle">
  <text x="590" y="47">INGEST</text><text x="590" y="210">PROCESS</text>
  <text x="720" y="88">AI / ML</text><text x="841" y="47">CLOUD</text><text x="841" y="210">SERVE</text>
</g>
<g fill="#102B3D" stroke="#3898B2" stroke-width="1.4">
  <rect x="574" y="62" width="32" height="32" rx="7"/><rect x="574" y="158" width="32" height="32" rx="7"/>
  <rect x="698" y="104" width="44" height="44" rx="10" stroke="#5EEAD4"/>
  <rect x="825" y="61" width="32" height="32" rx="7"/><rect x="825" y="158" width="32" height="32" rx="7"/>
</g>
<g fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="590" cy="72" rx="8" ry="4"/><path d="M582 72V84Q590 91 598 84V72M582 78Q590 85 598 78"/>
  <path d="M582 167H598M582 174H594M582 181H590"/>
  <path d="M833 81H849L852 77 848 73H845Q841 65 836 73L832 75Z"/>
  <path d="M833 180V175M840 180V168M847 180V172"/>
</g>
<g fill="#5EEAD4">
